<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <h1>⭐</h1>
        <h2>SafeSpace</h2>
        <p>🏠︎ Home</p>
        <p>📈 Statistic</p>
        <p>⚙️Setting</p>
        <br><br><br>
        <p>⇥ Log Out</p>
    </div>
    <div class="main">
        <h1>Welcome Back</h1>
        <p>Here is your dashboard overview.</p>
        <div class="card">
            <h2>1250</h2>
            <p>Users</p>
        </div>
        <div class="card">
            <h2>24</h2>
            <p>New Alerts</p>
        </div>
        <div class="card">
            <h2>98%</h2>
            <p>Safety Rate</p>
        </div>
    </div>
    <div class="bottom">
    <div class="overview">
        <h2>Overview</h2>
        <div class="chart">
            <div class="bar bar1"></div>
            <div class="bar bar2"></div>
            <div class="bar bar3"></div>
            <div class="bar bar4"></div>
            <div class="bar bar5"></div>

        </div>
        <div class="days">
            <p>Mon</p>
            <p>Tue</p>
            <p>Wed</p>
            <p>Thu</p>
            <p>Fri</p>
        </div>
    </div>
    <div class="Quick">
        <h2>Quick Links</h2>
        <p>Safety Guide</p>
        <p>Learn More</p>
        <p>Get Help</p>
    </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
    *{
        box-sizing:border-box;
    }
    body{
        margin:0;
        min-height:100vh;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding:1rem;

    }
    header,main,.Item,aside,footer{
        border-radius: 0.5rem;
        color: white;
        font-weight: bold;

    }
    header{
        background-color: #1e90ff;
        box-shadow: 0 3px 0 #0077ea;
        padding: 1rem;
    }
    .content{
        display: flex;
        flex-direction: row;
        gap:1rem;
        flex-grow:1;

    }
    main{
        background-color: #3cb371;
        box-shadow:0 3px 0 #2f8d59;
        flex-grow:1;
        padding:1rem;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 1rem;


    }
    .Item{
        background-color: #2f8d59;
        box-shadow:0 3px 0 #226741;
        width: 4rem;
        height:3rem;
    }
    aside{
        background-color: #ff6374;
        box-shadow:0 3px 0 #e02200;
        width: 8rem;
        padding:1rem;
    }
    footer{
        background-color: #4169e1;
        box-shadow:0 3px 0 #1d44b8;
        padding: 1rem;


    }
    
    </style>
    
</head>
<body>
    <header>header</header>
    <div class="content">
        
        <main>
            <p>main </p>
            <div class="Item">item</div>
            <div class="Item">item</div>
            <div class="Item">item</div>
            <div class="Item">item</div>
            <div class="Item">item</div>
            <div class="Item">item</div>
            <div class="Item">item</div>
            <div class="Item">item</div>
            <div class="Item">item</div>
            <div class="Item">item</div>
            <div class="Item">item</div>
        </main>
        <aside>sidebar</aside>
    </div>
    <footer>footer</footer>
</body>
</html>
